name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      # Catches config problems (SDK/library mismatches) before they reach a build.
      - name: expo-doctor
        working-directory: packages/mobile
        run: npx --yes expo-doctor

      - name: Bundle for Android and iOS (proves Metro + monorepo + Sentry config)
        working-directory: packages/mobile
        env:
          CI: '1'
          EXPO_PUBLIC_ENV: development
        run: npx expo export --platform android --platform ios --output-dir dist

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans the full history for committed credentials (doc 08 section 8.6).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Reports known vulnerabilities. Not yet blocking: transitive dev-tool advisories need triage first.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  # Phase 2 adds: start local Supabase -> apply migrations -> pgTAP -> function tests (doc 08 section 8.5).
