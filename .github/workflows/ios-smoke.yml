name: ios-smoke

# Verifies the app on iOS without a Mac of our own (docs/04-architecture.md section 4.12):
# builds a Release simulator app on a GitHub macOS runner, boots an iOS Simulator,
# runs the Maestro smoke flow and uploads screenshots.
#
# Billing note: macOS runner minutes cost more than Linux. PRs run only when mobile/shared code changes.

on:
  pull_request:
    paths:
      - 'packages/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/ios-smoke.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with .env.example. A rename changes only this value.
  APP_BUNDLE_ID: com.example.cadence
  APP_SCHEME: cadence

jobs:
  ios:
    name: iOS Simulator smoke test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: pnpm install --frozen-lockfile

      - name: Generate the native iOS project
        working-directory: packages/mobile
        env:
          APP_BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
          EXPO_PUBLIC_ENV: development
        run: npx expo prebuild --platform ios --no-install

      # `prebuild --no-install` skips CocoaPods, and the .xcworkspace only exists after `pod install`.
      - name: Install CocoaPods dependencies
        working-directory: packages/mobile/ios
        env:
          LANG: en_US.UTF-8
        run: pod install

      - name: Build Release app for the simulator
        working-directory: packages/mobile/ios
        env:
          EXPO_PUBLIC_ENV: development
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 40

      - name: Boot an iPhone simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Install the app
        run: |
          set -euo pipefail
          APP=$(find packages/mobile/ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)
          echo "Installing $APP"
          xcrun simctl install "$SIM_UDID" "$APP"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run smoke flow
        run: |
          set -euo pipefail
          mkdir -p maestro-out
          sed "s/__APP_ID__/${APP_BUNDLE_ID}/" packages/mobile/e2e/smoke.yaml > maestro-out/smoke.yaml
          maestro --device "$SIM_UDID" test maestro-out/smoke.yaml --test-output-dir maestro-out/results

      # Phase 1: the design gallery in light and dark at the default text size, then again with the
      # largest "accessibility-large" Dynamic Type step (about 2x body text) to check nothing truncates.
      - name: Run design gallery flow
        run: |
          set -euo pipefail
          mkdir -p maestro-out
          sed -e "s/__APP_ID__/${APP_BUNDLE_ID}/" -e "s/__APP_SCHEME__/${APP_SCHEME}/"             packages/mobile/e2e/gallery.yaml > maestro-out/gallery.yaml
          maestro --device "$SIM_UDID" test maestro-out/gallery.yaml -e PREFIX=gallery             --test-output-dir maestro-out/gallery-results

      - name: Run design gallery flow at large text
        run: |
          set -euo pipefail
          xcrun simctl ui "$SIM_UDID" content_size accessibility-large
          maestro --device "$SIM_UDID" test maestro-out/gallery.yaml -e PREFIX=gallery-large-text             --test-output-dir maestro-out/gallery-large-text-results
          xcrun simctl ui "$SIM_UDID" content_size large

      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-screenshots
          path: maestro-out/
          if-no-files-found: warn
